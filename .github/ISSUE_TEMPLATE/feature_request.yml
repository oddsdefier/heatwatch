name: Feature request
description: Suggest a change that helps people understand their Mac's heat.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to understand or do?
      description: Describe the problem before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Privacy and hardware considerations
      description: HeatWatch does not request root, control fans, or collect command arguments or browser URLs.
